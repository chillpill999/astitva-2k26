# ASTITVA 2K26 — Production Compose
# Usage: docker compose up -d
#
# Spins up:
#   - app    : Next.js production server (port 3000)
#   - db     : PostgreSQL 16 with persistent volume
#   - adminer: Database admin UI (port 8080)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/astitva2k26?schema=public
      DIRECT_URL: postgresql://postgres:postgres@db:5432/astitva2k26?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-please-use-a-strong-secret}
      QR_ENCRYPTION_KEY: ${QR_ENCRYPTION_KEY:-change-me-please}
      CERT_SIGNING_KEY: ${CERT_SIGNING_KEY:-change-me-please}
      NEXT_PUBLIC_AUTH_PROVIDER: ${NEXT_PUBLIC_AUTH_PROVIDER:-mock}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: astitva2k26
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d astitva2k26"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  adminer:
    image: adminer:4.8.1
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
