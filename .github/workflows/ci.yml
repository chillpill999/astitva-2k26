# ASTITVA 2K26 - GitHub Actions CI/CD Pipeline
name: astitva-2k26-ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  typecheck-and-lint:
    name: TypeScript & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/astitva2k26
        run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint || true

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: typecheck-and-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/astitva2k26
          JWT_SECRET: ci-build-secret
          NEXT_PUBLIC_AUTH_PROVIDER: mock
        run: npx next build

  unit-tests:
    name: Unit Tests (M5–M8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/astitva2k26
        run: npx prisma generate
      - name: QR Crypto
        run: npx tsx tests/m5/qr-crypto.test.ts
      - name: Attendance Integration
        run: npx tsx tests/m5/attendance-integration.test.ts
      - name: Certificate Crypto
        run: npx tsx tests/m7/certificate-crypto.test.ts
      - name: AI Matcher
        run: npx tsx tests/m8/ai-matcher.test.ts

  e2e-tests:
    name: E2E Master Suite
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/astitva2k26
        run: npx prisma generate
      - name: Run E2E
        env:
          NEXTAUTH_SECRET: astitva-2k26-super-secret
        run: npm run test:e2e

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: ghcr.io/${{ github.repository_owner }}/astitva-2k26:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
